<!-- MODAL SOLICITUD -->
<div class="hidden" id="modal-solicitud-overlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box">
  <div style="background:var(--bg-card);border-radius:16px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;padding:22px;box-sizing:border-box">
    <button onclick="cerrarModalSolicitud()" style="float:right;background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-secondary)">✕</button>
    <div style="font-size:17px;font-weight:700" id="modal-sol-nombre">—</div>
    <div style="font-size:13px;color:var(--text-muted);margin-top:2px" id="modal-sol-correo">—</div>
    <div style="font-size:11.5px;color:var(--text-muted);margin-top:2px" id="modal-sol-fecha">—</div>

    <div class="form-group" style="margin-top:16px">
      <label style="font-size:11px;color:var(--text-muted)">Número económico (opcional)</label>
      <input type="text" id="modal-sol-economico" placeholder="Ej: OP-1021" style="width:100%;font-size:14px;padding:9px 10px;border:0.5px solid var(--border-strong);border-radius:8px;background:var(--bg-app);color:var(--text-primary);box-sizing:border-box"/>
    </div>

    <div class="form-group" style="margin-top:12px">
      <label style="font-size:11px;color:var(--text-muted)">Nombre oficial (el que verá el cliente en ADREMATASA)</label>
      <input type="text" id="modal-sol-nombreoficial" placeholder="Nombre completo oficial" style="width:100%;font-size:14px;padding:9px 10px;border:0.5px solid var(--border-strong);border-radius:8px;background:var(--bg-app);color:var(--text-primary);box-sizing:border-box"/>
    </div>

    <div class="form-group" style="margin-top:12px">
      <label style="font-size:11px;color:var(--text-muted)">Teléfono</label>
      <div style="display:flex;gap:6px">
        <select id="modal-sol-lada" style="width:92px;flex-shrink:0;font-size:14px;padding:9px 10px;border:0.5px solid var(--border-strong);border-radius:8px;background:var(--bg-app);color:var(--text-primary)">
          <option value="52">MX+52</option>
          <option value="1">US+1</option>
        </select>
        <input type="tel" id="modal-sol-telefono" placeholder="10 dígitos" style="flex:1;min-width:0;font-size:14px;padding:9px 10px;border:0.5px solid var(--border-strong);border-radius:8px;background:var(--bg-app);color:var(--text-primary);box-sizing:border-box"/>
      </div>
    </div>

    <div id="modal-sol-botones" style="display:flex;gap:8px;margin-top:20px"></div>
  </div>
</div>
