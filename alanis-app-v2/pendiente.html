<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#2C1E0F"/>
  <title>Autotransportes Alanís — Solicitud enviada</title>
  <link rel="stylesheet" href="css/main.css"/>
  <style>
    body { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100dvh; padding:24px 20px; background:var(--bg-app); }
    .pending-card { width:100%; max-width:380px; background:var(--bg-card); border-radius:24px; border:0.5px solid var(--border); padding:40px 28px 32px; box-shadow:0 4px 24px rgba(44,30,15,0.10); text-align:center; }
    .logo-wrap { width:100px; height:100px; background:#fff; border-radius:22px; border:0.5px solid var(--border-strong); display:flex; align-items:center; justify-content:center; margin:0 auto 24px; padding:12px; box-shadow:0 2px 10px rgba(44,30,15,0.08); }
    .logo-wrap img { width:78px; height:78px; object-fit:contain; }
    .status-icon { width:64px; height:64px; background:var(--brand-pale); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 20px; border:0.5px solid var(--border-strong); }
    .status-icon svg { width:32px; height:32px; color:var(--brand-light); }
    .pending-title { font-size:20px; font-weight:700; color:var(--text-primary); margin-bottom:10px; }
    .pending-sub { font-size:14px; color:var(--text-secondary); line-height:1.6; margin-bottom:24px; }
    .pending-sub strong { color:var(--text-primary); }
    .info-box { background:var(--brand-pale); border-radius:14px; border:0.5px solid var(--border); padding:16px 18px; margin-bottom:24px; text-align:left; }
    .info-row { display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:0.5px solid var(--border); font-size:13px; }
    .info-row:last-child { border-bottom:none; }
    .info-row svg { width:15px; height:15px; color:var(--brand-light); flex-shrink:0; }
    .info-label { color:var(--text-muted); }
    .info-value { color:var(--text-primary); font-weight:600; margin-left:auto; font-size:12px; }
    .waiting-dots { display:flex; justify-content:center; gap:6px; margin-bottom:24px; }
    .dot-pulse { width:8px; height:8px; border-radius:50%; background:var(--brand-light); opacity:0.3; animation:pulse 1.4s ease-in-out infinite; }
    .dot-pulse:nth-child(2) { animation-delay:0.2s; }
    .dot-pulse:nth-child(3) { animation-delay:0.4s; }
    @keyframes pulse { 0%,80%,100%{opacity:0.3;transform:scale(0.8)} 40%{opacity:1;transform:scale(1)} }
    .btn-logout { width:100%; padding:12px; background:transparent; color:var(--text-muted); border:0.5px solid var(--border-strong); border-radius:10px; font-size:14px; cursor:pointer; }
    .btn-logout:hover { background:var(--brand-pale); }
    .footer { margin-top:20px; font-size:11px; color:var(--text-muted); }
  </style>
</head>
<body>
<div class="pending-card">
  <div class="logo-wrap"><img src="img/logo.webp" alt="Logo Autotransportes Alanís"/></div>
  <div class="status-icon">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
  </div>
  <h1 class="pending-title">Solicitud enviada</h1>
  <p class="pending-sub">Tu solicitud de acceso fue recibida.<br/>Un <strong>administrador</strong> la revisará y te dará acceso en breve.</p>
  <div class="waiting-dots"><div class="dot-pulse"></div><div class="dot-pulse"></div><div class="dot-pulse"></div></div>
  <div class="info-box">
    <div class="info-row">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span class="info-label">Nombre</span><span class="info-value" id="user-name">—</span>
    </div>
    <div class="info-row">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      <span class="info-label">Correo</span><span class="info-value" id="user-email" style="font-size:11px">—</span>
    </div>
    <div class="info-row">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span class="info-label">Fecha solicitud</span><span class="info-value" id="fecha-solicitud">—</span>
    </div>
    <div class="info-row">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span class="info-label">Estado</span><span class="info-value" style="color:#BA7517">🟡 Pendiente aprobación</span>
    </div>
  </div>
  <button class="btn-logout" onclick="doLogout()">Cerrar sesión y salir</button>
</div>
<div class="footer">© 2025 Autotransportes Alanís</div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
firebase.auth().onAuthStateChanged(user => {
  if (!user) { window.location.href = 'index.html'; return; }
  document.getElementById('user-name').textContent = user.displayName || '—';
  document.getElementById('user-email').textContent = user.email || '—';
  document.getElementById('fecha-solicitud').textContent = new Date().toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'});
});
function doLogout() { firebase.auth().signOut().then(() => window.location.href = 'index.html'); }
</script>
</body>
</html>
